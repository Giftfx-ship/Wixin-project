<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Sign In | Prime Heritage Trust</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0A2540 0%, #1F4A6E 100%);
      padding: 20px;
    }
    .auth-card {
      background: var(--bg-card);
      border-radius: 48px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow-xl);
      animation: slideUp 0.5s ease;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-header i {
      font-size: 56px;
      color: var(--accent);
      margin-bottom: 16px;
    }
    .auth-header h2 {
      font-size: 28px;
      color: var(--text-primary);
    }
    .tab-container {
      display: flex;
      gap: 12px;
      background: var(--bg-primary);
      padding: 4px;
      border-radius: 60px;
      margin-bottom: 32px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 12px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }
    .tab.active {
      background: var(--accent);
      color: #0A2540;
    }
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }
    .form-group i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 14px 16px 14px 48px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 16px;
      font-family: inherit;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: 0.3s;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(245,166,35,0.2);
    }
    .btn-auth {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #0A2540;
      border: none;
      border-radius: 40px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      margin-top: 12px;
      transition: 0.3s;
    }
    .btn-auth:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }
    .auth-form {
      display: none;
    }
    .auth-form.active {
      display: block;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: 0.3s;
    }
    .modal.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-content {
      background: var(--bg-card);
      border-radius: 32px;
      padding: 32px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      animation: slideUp 0.4s ease;
    }
    .modal-content input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      margin: 16px 0;
      text-align: center;
      font-size: 24px;
      letter-spacing: 8px;
      background: var(--bg-primary);
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <i class="fas fa-crown"></i>
        <h2>Prime Heritage Trust</h2>
        <p style="color: var(--text-secondary);">Global Digital Banking</p>
      </div>
      
      <div class="tab-container">
        <div class="tab active" data-tab="login">Sign In</div>
        <div class="tab" data-tab="register">Create Account</div>
      </div>

      <div id="loginForm" class="auth-form active">
        <form onsubmit="event.preventDefault(); login();">
          <div class="form-group">
            <i class="fas fa-envelope"></i>
            <input type="email" id="loginEmail" placeholder="Email Address" required>
          </div>
          <div class="form-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="loginPin" placeholder="PIN (4-6 digits)" maxlength="6" required>
          </div>
          <button type="submit" class="btn-auth">Sign In</button>
        </form>
        <div style="text-align: center; margin-top: 20px;">
          <a href="#" style="color: var(--accent); text-decoration: none; font-size: 14px;">Forgot PIN?</a>
        </div>
      </div>

      <div id="registerForm" class="auth-form">
        <form onsubmit="event.preventDefault(); sendVerification();">
          <div class="form-group">
            <i class="fas fa-user"></i>
            <input type="text" id="regName" placeholder="Full Name" required>
          </div>
          <div class="form-group">
            <i class="fas fa-envelope"></i>
            <input type="email" id="regEmail" placeholder="Email Address" required>
          </div>
          <div class="form-group">
            <i class="fas fa-phone"></i>
            <input type="tel" id="regPhone" placeholder="Phone Number" required>
          </div>
          <div class="form-group">
            <i class="fas fa-globe"></i>
            <select id="regCountry" required>
              <option value="">Select Country</option>
              <option value="US">United States</option>
              <option value="UK">United Kingdom</option>
              <option value="CA">Canada</option>
              <option value="AU">Australia</option>
              <option value="DE">Germany</option>
              <option value="FR">France</option>
              <option value="AE">UAE</option>
              <option value="SG">Singapore</option>
            </select>
          </div>
          <div class="form-group">
            <i class="fas fa-money-bill"></i>
            <select id="regCurrency" required>
              <option value="USD">💵 USD - US Dollar</option>
              <option value="EUR">💶 EUR - Euro</option>
              <option value="GBP">💷 GBP - British Pound</option>
              <option value="CAD">🇨🇦 CAD - Canadian Dollar</option>
              <option value="AUD">🇦🇺 AUD - Australian Dollar</option>
            </select>
          </div>
          <div class="form-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="regPin" placeholder="Create Transaction PIN (4-6 digits)" maxlength="6" required>
          </div>
          <div class="form-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="regConfirmPin" placeholder="Confirm PIN" maxlength="6" required>
          </div>
          <button type="submit" class="btn-auth">Continue</button>
        </form>
      </div>
    </div>
  </div>

  <div id="verifyModal" class="modal">
    <div class="modal-content">
      <i class="fas fa-envelope" style="font-size: 48px; color: var(--accent);"></i>
      <h3>Email Verification</h3>
      <p>Enter the 6-digit code sent to <strong id="verifyEmail"></strong></p>
      <input type="text" id="verifyCode" maxlength="6" placeholder="••••••">
      <button onclick="verifyCode()" class="btn-auth" style="margin-top: 8px;">Verify</button>
      <button onclick="resendCode()" style="background: none; border: none; color: var(--accent); margin-top: 12px; cursor: pointer;">Resend Code</button>
    </div>
  </div>

  <div id="loadingModal" class="modal">
    <div class="modal-content">
      <div class="spinner"></div>
      <p>Creating your account...</p>
      <p style="font-size: 12px; margin-top: 8px;">Please wait</p>
    </div>
  </div>

  <script>
    const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : '/api';
    let pendingUser = null;
    let pendingCode = null;

    function generateCode() {
      return Math.floor(100000 + Math.random() * 900000).toString();
    }

    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${message}`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    async function sendVerification() {
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const phone = document.getElementById('regPhone').value;
      const country = document.getElementById('regCountry').value;
      const currency = document.getElementById('regCurrency').value;
      const pin = document.getElementById('regPin').value;
      const confirmPin = document.getElementById('regConfirmPin').value;

      if (!name || !email || !phone || !country || !pin) {
        showToast('All fields required', 'error');
        return;
      }
      if (pin !== confirmPin) {
        showToast('PINs do not match', 'error');
        return;
      }
      if (pin.length < 4 || pin.length > 6) {
        showToast('PIN must be 4-6 digits', 'error');
        return;
      }

      pendingUser = { fullName: name, email, phone, country, currency, transactionPin: pin };
      pendingCode = generateCode();

      try {
        const response = await fetch(`${API_URL}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(pendingUser)
        });
        
        const data = await response.json();
        
        if (response.ok) {
          document.getElementById('verifyEmail').innerText = email;
          document.getElementById('verifyModal').classList.add('active');
          showToast('Verification code sent to your email');
        } else {
          showToast(data.error, 'error');
        }
      } catch (error) {
        console.error('Error:', error);
        showToast('Failed to send verification', 'error');
      }
    }

    async function verifyCode() {
      const code = document.getElementById('verifyCode').value;
      
      if (!code || code.length !== 6) {
        showToast('Please enter 6-digit code', 'error');
        return;
      }
      
      document.getElementById('verifyModal').classList.remove('active');
      document.getElementById('loadingModal').classList.add('active');
      
      try {
        const response = await fetch(`${API_URL}/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: pendingUser.email, code })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          sessionStorage.setItem('token', data.token);
          sessionStorage.setItem('currentUser', JSON.stringify(data.user));
          showToast('Account created successfully!');
          setTimeout(() => {
            window.location.href = data.user.isAdmin ? 'admin.html' : 'dashboard.html';
          }, 1500);
        } else {
          document.getElementById('loadingModal').classList.remove('active');
          showToast(data.error, 'error');
          document.getElementById('verifyModal').classList.add('active');
        }
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('loadingModal').classList.remove('active');
        showToast('Verification failed', 'error');
        document.getElementById('verifyModal').classList.add('active');
      }
    }

    function resendCode() {
      if (pendingUser) {
        sendVerification();
        showToast('New verification code sent');
      }
    }

    async function login() {
      const email = document.getElementById('loginEmail').value;
      const pin = document.getElementById('loginPin').value;
      
      if (!email || !pin) {
        showToast('Please enter email and PIN', 'error');
        return;
      }
      
      try {
        const response = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, pin })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          sessionStorage.setItem('token', data.token);
          sessionStorage.setItem('currentUser', JSON.stringify(data.user));
          showToast('Login successful!');
          setTimeout(() => {
            window.location.href = data.user.isAdmin ? 'admin.html' : 'dashboard.html';
          }, 1000);
        } else {
          showToast(data.error, 'error');
        }
      } catch (error) {
        console.error('Error:', error);
        showToast('Login failed', 'error');
      }
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('loginForm').classList.toggle('active', tab.dataset.tab === 'login');
        document.getElementById('registerForm').classList.toggle('active', tab.dataset.tab === 'register');
      });
    });
  </script>
</body>
</html>
